name: Release

# Every push to main: test, then semantic-release decides the version from the Conventional Commits since the last
# tag, writes it into Cargo.toml and herdr-plugin.toml, commits that back, tags vX.Y.Z and publishes a GitHub release
# with the macOS arm64 binary (.releaserc.json, scripts/set-version.sh).
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@24 -p @semantic-release/exec@6 -p @semantic-release/git@10 semantic-release
